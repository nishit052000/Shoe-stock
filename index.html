<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoe Stock</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#14213d;--mute:#667085;--line:#e4dfd5;--acc:#0b6e6e;--accInk:#fff;--warn:#c2410c;--ok:#e3f3ef;--okInk:#0b5a52;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#18222e;--ink:#e8edf3;--mute:#9aa7b6;--line:#2a3746;--acc:#3cc2b5;--accInk:#06201d;--warn:#fb923c;--ok:#12332f;--okInk:#7fe0d4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1720;--card:#18222e;--ink:#e8edf3;--mute:#9aa7b6;--line:#2a3746;--acc:#3cc2b5;--accInk:#06201d;--warn:#fb923c;--ok:#12332f;--okInk:#7fe0d4;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Figtree,system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-height:44px}
.back{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
.crumb{color:var(--mute);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
#homeb{padding:10px 14px;font-size:18px;line-height:1}
.addb{border:1px solid var(--acc);background:none;color:var(--acc);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
h1{font:800 30px/1.1 'Bricolage Grotesque',system-ui,sans-serif;margin:14px 0 16px}
.big{display:grid;gap:14px}
.big.two{grid-template-columns:1fr 1fr}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;border:2px solid var(--line);background:var(--card);border-radius:18px;cursor:pointer;font:800 26px 'Bricolage Grotesque',system-ui,sans-serif;padding:16px}
.opt:hover,.opt:active{border-color:var(--acc)}
.opt .e{font-size:44px;line-height:1}
.opt small{font:400 14px Figtree,system-ui,sans-serif;color:var(--mute)}
.list .opt{flex-direction:row;min-height:84px;justify-content:flex-start;gap:16px;padding:14px 20px}
.sz{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sz .opt{min-height:96px;font-size:30px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0}
.card img,.ph{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--ok)}
.ph{display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--okInk)}
.cb{padding:10px 12px}
.cb b{display:block;font:600 16px 'Bricolage Grotesque',system-ui,sans-serif}
.cb span{color:var(--mute);font-size:14px}
.q{display:inline-block;margin-top:4px;border-radius:999px;background:var(--ok);color:var(--okInk);padding:2px 10px;font-size:13px;font-weight:600}
.q.low{background:none;border:1px solid var(--warn);color:var(--warn)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.modal{position:fixed;inset:0;background:rgba(10,15,22,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet img.hero{width:100%;max-height:52vh;object-fit:contain;background:var(--bg);border-radius:12px}
.sheet h2{font:800 22px 'Bricolage Grotesque',system-ui,sans-serif;margin:10px 0 2px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pill{border:1px solid transparent;border-radius:10px;padding:8px 10px;min-width:60px;background:var(--ok);color:var(--okInk);cursor:pointer;text-align:center;line-height:1.15}
.pill small{display:block;font-size:12px}.pill b{font-size:18px}
.pill.low{background:none;border-color:var(--warn);color:var(--warn)}
.pill.zero{background:var(--bg);color:var(--mute);text-decoration:line-through;cursor:default}
.pill.cur{outline:3px solid var(--acc)}
.btn{border:1px solid var(--line);background:var(--card);padding:12px 16px;border-radius:12px;cursor:pointer;font-weight:600}
.btn.main{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.btn.danger{color:var(--warn)}
.acts{display:flex;gap:10px;margin-top:14px}.acts .btn{flex:1}
#cs{color:var(--mute);font-size:13px;margin-top:6px}
#ro{background:var(--ok);color:var(--okInk);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
#sq{width:100%;padding:13px 14px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:17px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--bg);cursor:pointer}.chip.on{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:600}
.srow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.sum{display:flex;gap:10px}.sum div{flex:1;background:var(--bg);border-radius:10px;padding:10px 12px;color:var(--mute);font-size:14px}.sum b{display:block;color:var(--ink);font:800 24px Bricolage Grotesque,system-ui,sans-serif}
.cw{display:flex;flex-direction:column;gap:6px}.qs{width:100%;padding:12px 8px}
.sellbig{width:100%;padding:18px;font-size:19px;margin-top:4px}
.btn:disabled{opacity:.5;cursor:default}
.pill.cur{background:var(--acc);color:var(--accInk);border-color:var(--acc);outline:0}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
input[type=text],input[type=number],input[type=tel],input[type=date]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{margin:0;font-weight:600}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:10px 16px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--bg)}
.seg input:checked+span{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.seg input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.step button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:20px;cursor:pointer}
.step span{font-weight:600;text-align:center}.step em{font-style:normal;color:var(--mute);font-size:12px;display:block}
.photo{display:flex;gap:12px;align-items:center}
.photo img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--bg)}
.rth{width:56px;height:56px;flex:none;object-fit:cover;border-radius:8px;background:var(--ok);display:flex;align-items:center;justify-content:center;font-size:26px}.sm{padding:8px 12px;font-size:14px}.rw{border-color:var(--warn)!important;color:var(--warn)}
.addsize{display:flex;gap:8px;margin-top:10px}.addsize input{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:none;gap:14px;align-items:center;z-index:30;max-width:92%}
.toast.show{display:flex}.toast button{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer}

.brand{display:flex;align-items:baseline;gap:10px;margin:8px 0 0}.brand b{font:800 22px 'Bricolage Grotesque',system-ui,sans-serif;color:var(--acc)}.brand span{color:var(--mute);font-size:14px}
.opt{box-shadow:0 2px 8px rgba(20,33,61,.07);transition:transform .12s}.opt:active,.tile:active,.card:active{transform:scale(.97)}
.opt[data-g]{border:0;color:#fff;min-height:170px}.opt[data-g] small{color:rgba(255,255,255,.8)}
.opt[data-g=g]{background:linear-gradient(145deg,#2f8cff,#1a3fc4)}.opt[data-g=l]{background:linear-gradient(145deg,#e0407f,#9d174d)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border:1px solid var(--line);background:var(--card);border-radius:16px;cursor:pointer;text-align:left;box-shadow:0 1px 4px rgba(20,33,61,.07);transition:transform .12s}
.tile .ti{font-size:26px;line-height:1;margin-bottom:6px}.tile b{font:800 17px 'Bricolage Grotesque',system-ui,sans-serif}.tile small{color:var(--mute);font-size:13px}
.tile.main{background:var(--acc);border-color:var(--acc);color:var(--accInk)}.tile.main small{color:inherit;opacity:.85}
.tile.warn{border-color:var(--warn)}.tile.warn small{color:var(--warn);font-weight:600}
.card{box-shadow:0 1px 4px rgba(20,33,61,.08);border-radius:16px;transition:transform .12s}
.btn{border-radius:14px;min-height:46px}.btn.main{box-shadow:0 2px 6px rgba(11,110,110,.25)}
.sheet{border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18)}.sheet:before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.srow{align-items:center}.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><button class="back" id="back" hidden>Back</button><button class="back" id="homeb" hidden aria-label="Home">🏠</button><span class="crumb" id="crumb"></span><button class="addb" id="addb" aria-label="Add footwear">+ Add</button><button class="back" id="cfgb" aria-label="Shared database settings">⚙</button></div>
  <div id="cs"></div>
  <div id="ro" hidden>View only. You can see the stock, but you cannot add or sell yet. Ask the shop owner to give you edit access.</div>
  <input type="search" id="sq" placeholder="Search by name or code" aria-label="Search footwear by name or code">
  <div id="view"></div>
</div>
<div class="modal" id="m"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><span id="tmsg"></span><button id="undo">Undo</button></div>

<script>
(function(){
var G={g:'Gents',l:'Ladies'}, T=[['slipper','Slippers','🩴'],['eva','EVA','🩴'],['pu','PU','👡'],['flipflop','Flip Flop','🩴'],['crocs','Crocs','🐊'],['shoes','Shoes','👟'],['sandal','Sandal','👡']],
 TG={g:['slipper','eva','pu','flipflop','crocs','shoes','sandal'],l:['slipper','eva','pu','crocs','flipflop','shoes','sandal']};
var DEF={g:[6,7,8,9,10,11],l:[3,4,5,6,7,8]};
var LOW=parseInt(localStorage.getItem('shoe_low'),10)||3, rf='all';
function needs(i){return total(i)<=LOW}
function lowSz(i){return sk(i.stock).filter(function(s){return i.stock[s]<=1})}
function lowTail(i){return total(i)<=0?' Added to reorder list.':needs(i)?' Only '+total(i)+' left. Added to reorder list.':''}
function runGap(i){var ks=sk(i.stock),n=ks.length;if(total(i)<=0||n<4)return null;var h=ks.filter(function(x){return i.stock[x]>0});if(h.length*2>n)return null;return {have:h,miss:ks.filter(function(x){return !(i.stock[x]>0)})}}
function lowNote(i){var g=runGap(i),st='<div style="margin-top:8px;color:var(--warn);font-weight:600">';return (g?st+'\u26a0 Broken size run: only size '+g.have.map(esc).join(', ')+' left</div>':'')+(needs(i)?st+'\u26a0 Low stock: '+total(i)+' left'+(i.od?'. Ordered '+new Date(i.od).toLocaleDateString([],{day:'numeric',month:'short'}):'. On the reorder list')+'</div>':'')}
var items=[], nav={g:null,t:null,s:null}, ed=null, last=null, tt, db=null, memOnly=false, legacy=[], sdb=null, ready=false, detailId=null, detailSel=null;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tname(k){var r=T.filter(function(x){return x[0]===k})[0];return r?r[1]:k}
function tl(g){return TG[g].map(function(k){return T.filter(function(x){return x[0]===k})[0]})}
function temoji(k){var r=T.filter(function(x){return x[0]===k})[0];return r?r[2]:'👟'}
function sk(o){return Object.keys(o).sort(function(a,b){return parseFloat(a)-parseFloat(b)})}

/* local cache (so the app opens instantly, even with weak internet) */
var BASE='shoe_stock', IMG={}, IVS={}, polling=false, pend=0, idb=null;
function openDB(cb){try{var r=indexedDB.open('shoeshop-cloud',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){idb=r.result;cb()};r.onerror=function(){cb()}}catch(e){cb()}}
function idbGet(k,cb){if(!idb){cb();return}try{var q=idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){cb(q.result)};q.onerror=function(){cb()}}catch(e){cb()}}
function idbPut(k,v){if(!idb)return;try{idb.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
function loadCache(cb){idbGet('imgs',function(a){var o=a||{};Object.keys(o).forEach(function(id){IMG[id]=o[id].d;IVS[id]=o[id].iv});idbGet('cache',function(c){items=(c||[]).map(function(i){i.img=(IVS[i.id]===i.iv&&IMG[i.id])||'';return i});cb()})})}
function saveImgs(){var o={};Object.keys(IMG).forEach(function(id){o[id]={iv:IVS[id],d:IMG[id]}});idbPut('imgs',o)}
function saveCache(){idbPut('cache',items.map(function(i){return {id:i.id,name:i.name,price:i.price,g:i.g,t:i.t,ts:i.ts,iv:i.iv,stock:i.stock,od:i.od||0}}))}

/* photo: shrink to keep storage small */
function shrink(file,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){
 var m=1000,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
 var x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.85))};im.onerror=function(){cb(null)};im.src=fr.result};fr.readAsDataURL(file)}

function total(i){return sk(i.stock).reduce(function(a,s){return a+i.stock[s]},0)}
function count(g,t){return items.filter(function(i){return i.g===g&&(!t||i.t===t)&&total(i)>0}).length}
function reoBtn(){var n=items.filter(function(i){return needs(i)&&!i.od}).length;return '<button class="tile'+(n?' warn':'')+'" data-reo="1"><span class="ti">\ud83d\udce6</span><b>Reorder list</b><small>'+(n?n+' to order':'All stocked')+'</small></button>'}
function finBtn(){var n=items.filter(function(i){return total(i)<=0}).length;return n?'<div class="acts" style="margin-top:14px"><button class="btn" data-fin="1">Finished designs ('+n+')</button></div>':''}
function openFinished(){var f=items.filter(function(i){return total(i)<=0});$('sheet').innerHTML='<h2>Finished designs</h2><p style="color:var(--mute);margin:4px 0 12px">These have no pairs left, so customers do not see them. Tap one to add new stock.</p><div class="grid">'+f.map(function(i){return '<button class="card" data-edit="'+i.id+'">'+(i.img?'<img src="'+i.img+'" alt="'+esc(i.name)+'">':'<div class="ph">'+temoji(i.t)+'</div>')+'<div class="cb"><b>'+esc(i.name)+'</b><span>'+G[i.g]+' · '+tname(i.t)+'</span></div></button>'}).join('')+'</div><div class="acts"><button class="btn" data-x="close">Close</button></div>';$('m').classList.add('show')}

/* guided flow */
function render(){
 var sq=$('sq').value.trim().toLowerCase();if(sq){renderSearch(sq);return}
 var v=$('view'),step=!nav.g?0:!nav.t?1:nav.s===null?2:3;
 $('back').hidden=step===0;$('homeb').hidden=step===0;
 var parts=[];if(nav.g)parts.push(G[nav.g]);if(nav.t)parts.push(tname(nav.t));if(nav.s!==null)parts.push(nav.s==='all'?'All sizes':'Size '+nav.s);
 $('crumb').textContent=parts.join(' › ');
 if(step===0){
  v.innerHTML='<div class="brand"><b>G.R. Stores</b><span>Footwear stock</span></div><h1>Who is it for?</h1><div class="big two"><button class="opt" data-g="g"><span class="e">👞</span>Gents<small>'+count('g')+' designs</small></button><button class="opt" data-g="l"><span class="e">👠</span>Ladies<small>'+count('l')+' designs</small></button></div>'+'<div class="tiles">'+billBtn()+legBtn()+reoBtn()+repBtn()+'</div>'+finBtn()}
 else if(step===1){
  v.innerHTML='<h1>What type of footwear?</h1><div class="big list">'+tl(nav.g).map(function(t){return '<button class="opt" data-t="'+t[0]+'"><span class="e">'+t[2]+'</span><span>'+t[1]+'<small style="display:block">'+count(nav.g,t[0])+' designs</small></span></button>'}).join('')+'</div>'}
 else if(step===2){
  var pool=items.filter(function(i){return i.g===nav.g&&i.t===nav.t}),sizes={};
  pool.forEach(function(i){sk(i.stock).forEach(function(s){if(i.stock[s]>0)sizes[s]=(sizes[s]||0)+1})});
  var ks=sk(sizes);
  v.innerHTML='<h1>Which size?</h1>'+(ks.length?'<div class="sz">'+ks.map(function(s){return '<button class="opt" data-s="'+esc(s)+'">'+esc(s)+'<small>'+sizes[s]+' designs</small></button>'}).join('')+'</div><div class="acts"><button class="btn" data-s="all">Show all sizes</button></div>':'<div class="empty">No stock yet for '+G[nav.g]+' '+tname(nav.t)+'.<br>Tap “+ Add footwear” to add some.</div>')}
 else{
  var list=items.filter(function(i){return i.g===nav.g&&i.t===nav.t&&(nav.s==='all'?sk(i.stock).some(function(s){return i.stock[s]>0}):i.stock[nav.s]>0)});
  v.innerHTML='<h1>'+list.length+' '+(list.length===1?'design':'designs')+' available</h1>'+(list.length?'<div class="grid">'+list.map(function(i){
   var n=nav.s==='all'?sk(i.stock).reduce(function(a,s){return a+i.stock[s]},0):i.stock[nav.s];
   return '<div class="cw"><button class="card" data-open="'+i.id+'">'+(i.img?'<img src="'+i.img+'" alt="'+esc(i.name)+'">':'<div class="ph">'+temoji(i.t)+'</div>')+'<div class="cb"><b>'+esc(i.name)+'</b><span>'+(i.price?'₹'+esc(i.price):'')+'</span><br><span class="q'+((nav.s==='all'?needs(i):n<=1)?' low':'')+'">'+n+(nav.s==='all'?' pairs':' left in size '+esc(nav.s))+'</span></div></button>'+(nav.s==='all'?'':'<button class="btn main qs" data-quick="'+i.id+'">Sell 1 pair</button>')+'</div>'}).join('')+'</div>':'<div class="empty">Nothing found.</div>')}
}

$('view').addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.quick){sellOne(b.dataset.quick,nav.s,true);return}
 if(b.dataset.sales){openSales('t');return}
 if(b.dataset.mig){migrate();return}
 if(b.dataset.fin){openFinished();return}
 if(b.dataset.reo){openReorder('all');return}
 if(b.dataset.rep){openReport(30);return}
 if(b.dataset.bill){openBill(true);return}
 if(b.dataset.g){nav.g=b.dataset.g}else if(b.dataset.t){nav.t=b.dataset.t}else if(b.dataset.s!==undefined){nav.s=b.dataset.s}
 else if(b.dataset.open){openDetail(b.dataset.open,$('sq').value.trim()?null:undefined);return}
 else if(b.dataset.edit){openEditor(b.dataset.edit);return}
 location.hash=hashOf();window.scrollTo(0,0)});
$('back').addEventListener('click',function(){if(nav.s!==null)nav.s=null;else if(nav.t)nav.t=null;else nav.g=null;location.hash=hashOf()});

/* detail */
function renderSearch(q){
 $('back').hidden=true;$('homeb').hidden=false;$('crumb').textContent='Search results';
 var m=items.filter(function(i){return i.name.toLowerCase().indexOf(q)>=0}).sort(function(a,b){return (total(b)>0)-(total(a)>0)});
 $('view').innerHTML=m.length?'<h1>'+m.length+' found</h1><div class="grid">'+m.map(function(i){var n=total(i),av=sk(i.stock).filter(function(s){return i.stock[s]>0});

 ed=it?JSON.parse(JSON.stringify(it)):{id:'n'+Date.now()+Math.floor(Math.random()*1000),name:'',price:'',g:nav.g||'g',t:nav.t||'shoes',img:'',stock:{},isNew:true};
 if(ed.isNew)DEF[ed.g].forEach(function(s){ed.stock[s]=0});
 detailId=null;drawEd();$('m').classList.add('show')}
function grab(){if($('fn')){ed.name=$('fn').value;ed.price=$('fp').value}}
function drawEd(){
 var ks=sk(ed.stock);
 $('sheet').innerHTML='<h2>'+(ed.isNew?'Add footwear':'Edit footwear')+'</h2>'
 +'<label>Photo</label><div class="photo">'+(ed.img?'<img src="'+ed.img+'" alt="Photo preview">':'')+'<div style="display:flex;flex-direction:column;gap:8px"><label class="btn main" style="margin:0;cursor:pointer;text-align:center">\ud83d\udcf7 '+(ed.img?'Take a new photo':'Take photo')+'<input type="file" id="ph" accept="image/*" capture="environment" hidden></label><label style="margin:0;cursor:pointer;color:var(--mute);font-size:14px;text-decoration:underline;font-weight:400">or choose from gallery<input type="file" id="ph2" accept="image/*" hidden></label></div></div>'
 +'<label>For</label><div class="seg">'+Object.keys(G).map(function(k){return '<label><input type="radio" name="g" value="'+k+'"'+(ed.g===k?' checked':'')+'><span>'+G[k]+'</span></label>'}).join('')+'</div>'
 +'<label>Type</label><div class="seg">'+tl(ed.g).map(function(t){return '<label><input type="radio" name="t" value="'+t[0]+'"'+(ed.t===t[0]?' checked':'')+'><span>'+t[1]+'</span></label>'}).join('')+'</div>'
 +'<div class="row2"><div><label for="fn">Name or code</label><input type="text" id="fn" value="'+esc(ed.name)+'" placeholder="e.g. Sparx 214"></div><div><label for="fp">Price ₹</label><input type="number" id="fp" inputmode="numeric" value="'+esc(ed.price)+'"></div></div>'
 +'<label>Pairs in each size</label><div class="steps">'+ks.map(function(k){return '<div class="step"><button data-d="-1" data-k="'+esc(k)+'" aria-label="Less size '+esc(k)+'">−</button><span><em>Size '+esc(k)+'</em>'+ed.stock[k]+'</span><button data-d="1" data-k="'+esc(k)+'" aria-label="More size '+esc(k)+'">+</button></div>'}).join('')+'</div>'
 +'<div class="addsize"><input type="text" id="ns" placeholder="Add another size" aria-label="Another size"><button class="btn" data-x="ns">Add size</button></div>'
 +'<div class="acts">'+(ed.isNew?'':'<button class="btn danger" data-x="del">Delete</button>')+'<button class="btn" data-x="close">Cancel</button><button class="btn main" data-x="save">Save</button></div>'}

$('sheet').addEventListener('change',function(e){
 var t=e.target;
 if((t.id==='ph'||t.id==='ph2')&&t.files[0]){grab();shrink(t.files[0],function(d){if(d){ed.img=d;drawEd()}else alert('Could not read this photo.')})}
 else if(t.name==='g'){grab();ed.g=t.value;if(ed.isNew&&sk(ed.stock).every(function(s){return !ed.stock[s]})){ed.stock={};DEF[ed.g].forEach(function(s){ed.stock[s]=0})}drawEd()}
 else if(t.name==='t'){grab();ed.t=t.value;drawEd()}
 else if(t.id==='sd'&&t.value){openSales('d',t.value)}});
$('sheet').addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.edit){openEditor(b.dataset.edit);return}
 if(b.dataset.rapply){repApply();return}
 if(b.dataset.rp){openReport(+b.dataset.rp);return}
 if(b.dataset.bx){billAct(b.dataset.bx,b);return}
 if(b.dataset.bpick){billPick(b.dataset.bpick);return}
 if(b.dataset.rf){openReorder(b.dataset.rf);return}
 if(b.dataset.rord){setOrd(b.dataset.rord,b.dataset.on==='1');return}
 if(b.dataset.rsh){shareReorder(b.dataset.rsh);return}
 if(b.dataset.sret){saleAction(b.dataset.sret);return}
 if(b.dataset.sact){saleDo(b.dataset.sact,b.dataset.sid);return}
 if(b.dataset.sm){openSales(b.dataset.sm);return}
 if(b.dataset.pick){openDetail(b.dataset.id,b.dataset.pick);return}
 if(b.dataset.dosell){sellOne(b.dataset.dosell,b.dataset.s);return}
 if(b.dataset.sell){var i=items.filter(function(x){return x.id===b.dataset.sell})[0],s=b.dataset.s;if(i&&i.stock[s]>0){i.stock[s]--;last={id:i.id,s:s};save();render();if(total(i)>0){openDetail(i.id);toast('Sold 1 pair of size '+s)}else{closeM();toast('Sold the last pair. This design is now finished.')}}return}
 if(b.dataset.k!==undefined){grab();var k=b.dataset.k;ed.stock[k]=Math.max(0,(ed.stock[k]||0)+parseInt(b.dataset.d,10));drawEd();return}
 var x=b.dataset.x;
 if(x==='close')closeM();
 else if(x==='cfgsave')cfgSave();
 else if(x==='ns'){grab();var v=$('ns').value.trim();if(v&&!isNaN(parseFloat(v))&&!(v in ed.stock))ed.stock[v]=0;drawEd()}
 else if(x==='save'){grab();if(!ed.name.trim()){$('fn').focus();return}
  var r={id:ed.id,name:ed.name.trim(),price:ed.price,g:ed.g,t:ed.t,img:ed.img,stock:ed.stock,iv:ed.iv,ts:ed.ts},o0=items.filter(function(y){return y.id===ed.id})[0];r.od=(o0&&total(ed)>total(o0))?0:(ed.od||0);
  var ix=items.findIndex(function(y){return y.id===r.id});if(ix>=0)items[ix]=r;else items.unshift(r);putItem(r);closeM();render()}
 else if(x==='del'){if(confirm('Delete this footwear?')){var did=ed.id;delItem(did);items=items.filter(function(y){return y.id!==did});closeM();render()}}});
$('m').addEventListener('click',function(e){if(e.target===$('m'))closeM()});
function closeM(){$('m').classList.remove('show');ed=null;detailId=null}
$('addb').addEventListener('click',function(){openEditor(null)});
$('sq').addEventListener('input',render);
$('cfgb').addEventListener('click',openCfg);
$('homeb').addEventListener('click',function(){
 var done=false;
 function go(){if(done)return;done=true;$('sq').value='';nav.g=null;nav.t=null;nav.s=null;if(location.hash.slice(1)!=='')location.hash='';else render();window.scrollTo(0,0)}
 if($('m').classList.contains('show')){window.addEventListener('hashchange',function f(){window.removeEventListener('hashchange',f);go()});setTimeout(go,700);closeM()}else go()});

function toast(m){$('tmsg').textContent=m;$('toast').classList.add('show');clearTimeout(tt);tt=setTimeout(function(){$('toast').classList.remove('show');last=null},5000)}
$('undo').addEventListener('click',function(){if(!last)return;if(last.sale){var ls=last.sale;todaySales=todaySales.filter(function(r){return r.id!==ls.sid});w(cf('sales/'+ls.day+'/'+ls.sid,'DELETE'))}var i=items.filter(function(x){return x.id===last.id})[0];if(i){setQty(i,last.s,i.stock[last.s]+1);render();if($('m').classList.contains('show')&&!ed)openDetail(i.id,last.s)}last=null;$('toast').classList.remove('show')});

applyHash();
openDB(function(){loadCache(function(){
 render();
 if(!cu()){cst('off');openCfg()}else{cst('off');pull()}
 setInterval(function(){if(!document.hidden)pull()},5000);
 document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()});
 window.addEventListener('online',pull)})});
})();
